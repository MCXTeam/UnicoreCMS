name: Pterodactyl image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docker/pterodactyl/**'
      - 'workspaces/updater/**'
      - 'compat/release-signing-public.pem'
      - '.github/workflows/pterodactyl.yml'
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pterodactyl/Dockerfile
          build-args: NODE_MAJOR=${{ matrix.node }}
          load: true
          tags: ghcr.io/mcxteam/unicorecms-pterodactyl:node${{ matrix.node }}
          labels: org.opencontainers.image.source=https://github.com/MCXTeam/UnicoreCMS
      - name: Verify native updater
        run: docker run --rm --cap-drop=ALL --security-opt=no-new-privileges --entrypoint node -e NATIVE_UPDATER_LIVE_TEST=1 -v "$PWD:/source:ro" ghcr.io/mcxteam/unicorecms-pterodactyl:node${{ matrix.node }} --test /source/workspaces/updater/test/native-live.test.mjs
      - name: Publish image
        run: docker push ghcr.io/mcxteam/unicorecms-pterodactyl:node${{ matrix.node }}

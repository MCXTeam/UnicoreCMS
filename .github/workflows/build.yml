name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
    - uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Use Node.js ${{ matrix.node }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
        cache: pnpm

    - name: Build
      run: |
        mv .env.example .env
        pnpm install --frozen-lockfile
        pnpm run build

    - name: API contract
      run: pnpm --filter unicore-api run api:check

    - name: Typecheck
      run: |
        pnpm --filter unicore-server run typecheck
        pnpm --filter unicore-client run typecheck
        pnpm --filter unicore-admin run typecheck

    - name: Prepare artifact
      if: matrix.node == 22
      run: |
        rm -rf .git
        rm -rf .github
        rm -rf ./node_modules
        rm -rf ./workspaces/*/node_modules
        rm -rf ./workspaces/client/.nuxt
        rm -rf ./workspaces/client/dist
        rm -rf ./workspaces/admin/.nuxt
        rm -rf ./workspaces/admin/dist
        rm -rf ./workspaces/server/src
        rm -rf ./logs
    - uses: actions/upload-artifact@v4
      if: matrix.node == 22
      with:
        name: UnicoreCMS
        path: ./

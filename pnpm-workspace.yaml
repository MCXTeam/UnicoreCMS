packages:
  - 'workspaces/*'

nodeLinker: hoisted
verifyDepsBeforeRun: false
engineStrict: true
strictPeerDependencies: false
autoInstallPeers: true

overrides:
  body-parser@2: ^2.4.0
  dompurify: ^3.4.17
  canvas: ^3.1.0
  multer: ^2.3.0
  fast-uri@3: ^3.1.8
  fast-uri@4: ^4.2.2
  fastify: ^5.8.5
  '@nestjs/swagger>js-yaml': ^5.2.2
  js-yaml@4: ^4.3.2
  svgo@4: ^4.1.0
  nodemailer: ^10.1.3
  proxy-addr: ^2.0.8
  undici@6: ^6.29.1
  undici@7: ^7.30.1
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  brace-expansion@3: ^3.0.9
  brace-expansion@5: ^5.0.12
  engine.io: ^6.6.11
  devalue@5: ^5.9.4
  seroval: ^1.6.10
  source-map-js: ^1.2.2
  shell-quote: ^1.12.0
  handlebars: ^4.7.10
  '@nuxt/devtools': ^3.4.3
  mailparser>linkify-it: ^5.0.2
  tsup>esbuild: ^0.28.1
  bundle-require>esbuild: ^0.28.1
  follow-redirects: ^1.16.1
  launch-editor: ^2.14.2
  vite@7: ^7.3.7

peerDependencyRules:
  ignoreMissing:
    - fastify

allowBuilds:
  '@swc/core': true
  '@parcel/watcher': true
  bcrypt: true
  canvas: true
  esbuild: true
  '@scarf/scarf': false
  core-js: false
  es5-ext: false

minimumReleaseAgeExclude:
  - nodemailer@10.1.3
  - seroval@1.6.10

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
  node-forge@1.4.0: patches/node-forge@1.4.0.patch

auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-86w9-cpqp-85rv

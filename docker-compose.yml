services:
  nginx:
    image: nginx:1.30.4-alpine
    container_name: unicorecms-nginx
    profiles:
      - nginx
    restart: unless-stopped
    environment:
      - ADMIN_HOST=${ADMIN_HOST?err}
      - CLIENT_HOST=${CLIENT_HOST?err}
      - SERVER_HOST=${SERVER_HOST?err}
      - CLIENT_PORT=${CLIENT_PORT:-3000}
      - ADMIN_PORT=${ADMIN_PORT:-4000}
      - BACKEND_PORT=${BACKEND_PORT:-${SERVER_PORT:-5000}}
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/tls.conf:/etc/nginx/tls.conf
      - ./docker/nginx/${NGINX_TEMPLATES:-templates}:/etc/nginx/templates
      - ./docker/certbot/conf:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot
      - ./logs/nginx:/var/log/nginx
    ports:
      - 80:80
      - 443:443
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # Обновление мажорной версии на существующих данных требует бэкапа ./docker/mysql-data
  mariadb:
    image: mariadb:11.8.9
    container_name: unicorecms-mariadb
    restart: unless-stopped
    ports:
      - 127.0.0.1:3306:3306
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE?err}
      MYSQL_USER: ${MYSQL_USER?err}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD?err}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD?err}
    volumes:
      - ./docker/mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  app:
    container_name: unicorecms
    profiles:
      - prod
    restart: always
    build:
      context: .
      dockerfile: ./docker/node/Dockerfile
    env_file: .env
    environment:
      DATABASE_HOST: mariadb
      UNICORE_CODE_ROOT: /usr/local/app
      UNICORE_DATA_ROOT: /data
      UNICORE_UPDATER_EXTERNAL: '1'
      UNICORE_UPDATER_CONNECTION_FILE: /updater/connection.json
    volumes:
      - ./:/data
      - ${PWD}/../.${COMPOSE_PROJECT_NAME:-unicorecms}-updater/ipc:/updater:ro
    ports:
      - "127.0.0.1:${CLIENT_PORT:-3000}:${CLIENT_PORT:-3000}"
      - "127.0.0.1:${ADMIN_PORT:-4000}:${ADMIN_PORT:-4000}"
      - "127.0.0.1:${BACKEND_PORT:-${SERVER_PORT:-5000}}:${BACKEND_PORT:-${SERVER_PORT:-5000}}"
    depends_on:
      mariadb:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G

  updater:
    profiles: [prod]
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/updater/Dockerfile
    environment:
      UNICORE_INSTALL_ROOT: ${PWD:?Run Docker Compose from the CMS directory}
      UNICORE_UPDATER_DIRECTORY: ${PWD}/../.${COMPOSE_PROJECT_NAME:-unicorecms}-updater
      UNICORE_APP_CONTAINER: unicorecms
      BACKEND_PORT: ${BACKEND_PORT:-${SERVER_PORT:-5000}}
    working_dir: ${PWD}
    command: [node, workspaces/updater/src/compose.mjs]
    volumes:
      - ${PWD}:${PWD}
      - ${PWD}/../.${COMPOSE_PROJECT_NAME:-unicorecms}-updater:${PWD}/../.${COMPOSE_PROJECT_NAME:-unicorecms}-updater
      - ${PWD}/../.${COMPOSE_PROJECT_NAME:-unicorecms}-updater/ipc:/ipc
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      app:
        condition: service_started

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.3
    container_name: unicorecms-pma
    restart: unless-stopped
    profiles:
      - dev
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    ports:
      - 127.0.0.1:8081:80
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  certbot:
    image: certbot/certbot:v5.8.0
    container_name: unicorecms-certbot
    profiles:
      - certbot
    volumes:
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    entrypoint: >
      certbot certonly --webroot --webroot-path=/var/www/certbot
      --email ${CERTBOT_EMAIL?err} --agree-tos --no-eff-email
      -d ${CLIENT_HOST?err} -d www.${CLIENT_HOST?err}
      -d ${ADMIN_HOST?err} -d ${SERVER_HOST?err}
